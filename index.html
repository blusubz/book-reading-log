<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Book Reading Logs</title>
    </head>
    <body>
        <div class="container">
            <h1>Welcome</h1>
            <h2>to your</h2>
            <h1>Library of Books</h1>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Pages</th>
                        <th>Read Status</th>
                        <th>Remove Book</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

            <!-- Dialog form for book input -->
             <dialog id="dialog">
                <form method="dialog" id="book-inputs">
                    <p>Please enter the following book properties to insert your book.</p>
                    <div>
                        <label for="title">Title</label>
                        <input type="text" id="title" name="bookTitle" required>
                    </div>
                    <div>
                        <label for="author">Author</label>
                        <input type="text" id="author" name="bookAuthor" required>
                    </div>
                    <div>
                        <label for="pages">Pages</label>
                        <input type="number" id="pages" name="bookPages" required>
                    </div>
                    <div>
                        <label for="read-status">Read Status</label>
                        <input type="checkbox" id="read-status" name="readStatus">
                    </div>

                    <button type="submit">Submit</button>
                </form>
             </dialog>
             <button id="show-dialog">New Book</button>
             <output></output>

        <script src="script.js" defer></script>
    </body>
</html>
